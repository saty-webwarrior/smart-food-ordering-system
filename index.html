<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Food Ordering System – College Canteen Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F3;--surface:#FFFFFF;--ink:#14201A;--mute:#5B6B62;--line:#D5DDD8;--green:#2E6B4A;--on-green:#fff;--saffron:#E8A317;--red:#B83A22;--ok:#E3F0E8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111A15;--surface:#19261F;--ink:#E8F0EA;--mute:#98AA9F;--line:#2C3D33;--green:#5FB487;--on-green:#08140D;--saffron:#F0B33A;--red:#F07A60;--ok:#1F3A2A}}
:root[data-theme="dark"]{--bg:#111A15;--surface:#19261F;--ink:#E8F0EA;--mute:#98AA9F;--line:#2C3D33;--green:#5FB487;--on-green:#08140D;--saffron:#F0B33A;--red:#F07A60;--ok:#1F3A2A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;margin:0;line-height:1.15}
header{background:var(--green);color:var(--on-green);padding:20px 20px 0}
.wrap{max-width:980px;margin:0 auto}
header h1{font-size:clamp(1.5rem,4vw,2.2rem);font-weight:800}
header p{margin:4px 0 14px;opacity:.9;font-size:.95rem}
nav{display:flex;gap:4px}
nav button{background:none;border:0;color:inherit;font:inherit;font-weight:500;padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;opacity:.8}
nav button[aria-selected=true]{border-color:var(--saffron);opacity:1;font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
main{padding:20px}
.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:28px}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
h2{font-size:1.3rem;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .n{flex:1}.row .n small{display:block;color:var(--mute)}
.price{font-weight:700;min-width:56px;text-align:right}
.qty{display:flex;align-items:center;gap:8px}
.qty button,.btn{border:1px solid var(--green);background:var(--surface);color:var(--green);border-radius:6px;font:inherit;font-weight:700;cursor:pointer}
.qty button{width:34px;height:34px}.qty span{min-width:18px;text-align:center}
.btn{padding:10px 16px}.btn.solid{background:var(--green);color:var(--on-green)}
.btn.warn{border-color:var(--red);color:var(--red)}
.msg{min-height:1.5em;color:var(--red);margin:6px 0}.msg.ok{color:var(--green)}
.total{display:flex;justify-content:space-between;font-weight:700;padding:12px 0}
.token{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.6rem;color:var(--saffron)}
.order{padding:14px 0;border-bottom:1px solid var(--line)}
.order .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.steps{display:flex;gap:4px;margin:10px 0 4px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--green)}.steps i.now{background:var(--saffron)}
.lbl{font-size:.9rem;color:var(--mute)}
.status{font-weight:700;color:var(--green)}
.switch{display:flex;align-items:center;gap:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:20px;margin-bottom:24px}
.stats b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:2rem;font-weight:800}
.bar{height:10px;background:var(--saffron);border-radius:5px;min-width:4px}
.empty{color:var(--mute);padding:12px 0}
footer{max-width:980px;margin:0 auto;padding:10px 20px 30px;color:var(--mute);font-size:.85rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer button{background:none;border:0;color:var(--red);cursor:pointer;font:inherit;text-decoration:underline}
</style>
</head>
<body>
<header><div class="wrap">
<h1>Smart Food Ordering System</h1>
<p>College canteen demo – order ahead, skip the queue.</p>
<nav role="tablist" aria-label="Choose a role">
<button role="tab" data-v="student">Student</button>
<button role="tab" data-v="staff">Canteen staff</button>
<button role="tab" data-v="admin">Admin report</button>
</nav></div></header>
<main><div class="wrap" id="app"></div></main>
<footer><span>Demo prototype for the PBL project (Group G14). Data is stored only in this browser.</span><button id="reset">Reset demo data</button></footer>
<script>
const KEY="sfos-demo-v1",ST=["Placed","Accepted","Preparing","Ready","Completed"];
const seed=()=>({next:101,menu:[["Masala Dosa",70],["Chole Bhature",60],["Paneer Roll",65],["Veg Fried Rice",80],["Veg Sandwich",40],["Samosa (2 pcs)",25],["Cold Coffee",50],["Masala Chai",15]].map(([name,price],i)=>({id:i+1,name,price,avail:true})),orders:[]});
let S,mem=null;
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return mem||seed()}
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
S=load();
let cart={},msg={t:"",ok:false},view="student";
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rs=n=>"₹"+n;
const item=id=>S.menu.find(m=>m.id===id);
function orderLines(o){return o.items.map(l=>`${esc(item(l.id).name)} × ${l.qty}`).join(", ")}
function steps(o){const k=ST.indexOf(o.status);return `<div class="steps" aria-hidden="true">${ST.map((_,i)=>`<i class="${i<k?"on":i===k?(k===4?"on":"now"):""}"></i>`).join("")}</div>`}

function student(){
 const avail=S.menu.filter(m=>m.avail),lines=Object.entries(cart).filter(([,q])=>q>0);
 const total=lines.reduce((t,[id,q])=>t+item(+id).price*q,0);
 const mine=S.orders.filter(o=>o.mine).slice().reverse();
 return `<div class="cols"><section><h2>Today’s menu</h2>
 ${avail.length?avail.map(m=>`<div class="row"><div class="n">${esc(m.name)}</div><div class="price">${rs(m.price)}</div>
 <div class="qty"><button data-a="dec" data-id="${m.id}" aria-label="Remove one ${esc(m.name)}">−</button><span>${cart[m.id]||0}</span><button data-a="inc" data-id="${m.id}" aria-label="Add one ${esc(m.name)}">+</button></div></div>`).join(""):'<p class="empty">No items are available right now. Check back soon.</p>'}
 </section><section><h2>Your cart</h2>
 ${lines.length?lines.map(([id,q])=>`<div class="row"><div class="n">${esc(item(+id).name)} × ${q}</div><div class="price">${rs(item(+id).price*q)}</div></div>`).join(""):'<p class="empty">Your cart is empty. Add items from the menu.</p>'}
 <div class="total"><span>Total</span><span>${rs(total)}</span></div>
 <button class="btn solid" data-a="place">Place order</button>
 <div class="msg ${msg.ok?"ok":""}" role="status">${esc(msg.t)}</div>
 <h2 style="margin-top:22px">Your orders</h2>
 ${mine.length?mine.map(o=>`<div class="order"><div class="top"><span class="token">#${o.id}</span><span class="status">${o.status}</span></div>${steps(o)}<div class="lbl">${orderLines(o)} · ${rs(o.total)}</div></div>`).join(""):'<p class="empty">No orders yet. Place one and follow it here.</p>'}
 </section></div>`}

function staff(){
 const open=S.orders.filter(o=>o.status!=="Completed");
 return `<div class="cols"><section><h2>Incoming orders</h2>
 ${open.length?open.map(o=>{const k=ST.indexOf(o.status);return `<div class="order"><div class="top"><span class="token">#${o.id}</span><span class="status">${o.status}</span></div>${steps(o)}<div class="lbl">${orderLines(o)} · ${rs(o.total)}</div>
 <div style="margin-top:10px"><button class="btn solid" data-a="adv" data-id="${o.id}">Mark ${ST[k+1]}</button></div></div>`}).join(""):'<p class="empty">No open orders. New orders appear here when students place them.</p>'}
 </section><section><h2>Menu availability</h2>
 ${S.menu.map(m=>`<div class="row"><div class="n">${esc(m.name)}<small>${m.avail?"Shown to students":"Hidden from students"}</small></div>
 <button class="btn ${m.avail?"warn":""}" data-a="tog" data-id="${m.id}">${m.avail?"Mark unavailable":"Mark available"}</button></div>`).join("")}
 </section></div>`}

function admin(){
 const n=S.orders.length,rev=S.orders.reduce((t,o)=>t+o.total,0),done=S.orders.filter(o=>o.status==="Completed").length;
 const sold={};S.orders.forEach(o=>o.items.forEach(l=>sold[l.id]=(sold[l.id]||0)+l.qty));
 const top=Object.entries(sold).sort((a,b)=>b[1]-a[1]).slice(0,5),max=top.length?top[0][1]:1;
 return `<div class="stats"><div><b>${n}</b>Orders placed</div><div><b>${done}</b>Orders completed</div><div><b>${rs(rev)}</b>Total sales</div></div>
 <h2>Most ordered items</h2>
 ${top.length?top.map(([id,q])=>`<div class="row"><div class="n" style="flex:0 0 150px">${esc(item(+id).name)}</div><div style="flex:1"><div class="bar" style="width:${Math.max(4,q/max*100)}%"></div></div><div class="price">${q}</div></div>`).join(""):'<p class="empty">No sales yet. Orders placed by students appear in this report.</p>'}`}

function render(){
 document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===view));
 app.innerHTML=({student,staff,admin})[view]();
}
function go(v){view=v;msg={t:"",ok:false};if(location.hash!=="#"+v)location.hash=v;render()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.v));
addEventListener("hashchange",()=>{const v=location.hash.slice(1);if(["student","staff","admin"].includes(v)&&v!==view){view=v;render()}});
app.addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=+b.dataset.id;
 if(a==="inc"){cart[id]=(cart[id]||0)+1;msg={t:"",ok:false}}
 else if(a==="dec"){cart[id]=Math.max(0,(cart[id]||0)-1)}
 else if(a==="place"){
  const items=Object.entries(cart).filter(([,q])=>q>0).map(([i,q])=>({id:+i,qty:q}));
  if(!items.length){msg={t:"Add at least one item before placing the order.",ok:false}}
  else{const total=items.reduce((t,l)=>t+item(l.id).price*l.qty,0);const oid=S.next++;
   S.orders.push({id:oid,items,total,status:"Placed",mine:true});save();cart={};msg={t:`Order #${oid} placed. Track it below.`,ok:true}}}
 else if(a==="adv"){const o=S.orders.find(o=>o.id===id);o.status=ST[Math.min(4,ST.indexOf(o.status)+1)];save()}
 else if(a==="tog"){item(id).avail=!item(id).avail;save()}
 render()});
addEventListener("storage",e=>{if(e.key===KEY){S=load();render()}});
$("#reset").onclick=()=>{S=seed();cart={};msg={t:"",ok:false};save();render()};
const h=location.hash.slice(1);if(["student","staff","admin"].includes(h))view=h;
render();
</script>
</body>
</html>
